# https://www.playframework.com/documentation/latest/ConfigFile

# Path to the LendingClub-format loan data CSV, relative to the working directory.
data_file = "data/LoanStats_securev1_2017Q4.csv"

play.modules.enabled += "dv01api.Module"

play.http.filters = "dv01api.filters.Filters"

# Play's default MIME table is a newline-separated "ext=type" string (not a HOCON object), extended via string
# concatenation. Without this, public/openapi.yaml would serve as application/octet-stream (.yaml is unrecognized).
play.http.fileMimeTypes = ${play.http.fileMimeTypes} """
  yaml=application/yaml
"""
